frame_detector:
  ros__parameters:
    # Canny edge detection thresholds
    canny_low: 50
    canny_high: 150
    # Probabilistic Hough transform
    hough_min_length: 50
    hough_max_gap: 20
    # Gaussian blur kernel size (must be odd)
    blur_kernel: 5

dirt_segmenter:
  ros__parameters:
    # HSV range for brown/dark dirt regions
    # Glass surface: H~105, S~12, V~249 (bright, near-white/blue)
    # Dirt regions:  H~93,  S~40, V~180-220 (darker, more saturated)
    # We target lower V AND higher S than the glass background.
    hsv_h_low: 70
    hsv_h_high: 130
    hsv_s_low: 25
    hsv_s_high: 255
    # V ceiling kept below glass brightness to exclude the clean surface
    hsv_v_low: 100
    hsv_v_high: 230
    # Morphological closing kernel size
    morph_kernel: 7
    # Minimum contour area in pixels to count as a region
    min_area_px: 200
    # Ignore top N% of image (glass frame edge lives there, not dirt)
    roi_top_fraction: 0.35
