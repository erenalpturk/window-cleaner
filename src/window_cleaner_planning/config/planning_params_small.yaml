coverage_planner:
  ros__parameters:
    # Phase 4 small-world variant of planning_params.yaml. Glass surface is
    # 2 m x 1 m (interior +/-1.00 / +/-0.50). Inset by ~robot_radius (0.18) +
    # small safety margin, the same 0.20 m inset glass_basic uses (its
    # +/-2.50/1.50 surface -> +/-2.30/1.30). KEEP THESE BOUNDS IN SYNC with
    # window_cleaner_evaluation/config/worlds_manifest.yaml (planner_inset
    # for `small`) and metrics measures coverage over the *real* surface
    # (+/-1.00/0.50), not this inset.
    glass_min_x: -0.80
    glass_max_x: 0.80
    glass_min_y: -0.30
    glass_max_y: 0.30

    # Same vacuum-pad strip width as the basic world.
    strip_width: 0.30

    waypoint_spacing: 0.50

    start_corner: "SW"

    path_frame: "map"

    latch: true
