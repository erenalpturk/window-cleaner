# Nav2 parameters for the window-cleaner robot.
#
# Architectural notes:
#   * Global frame is `map` (static occupancy from window_cleaner_bringup/maps/).
#   * Robot frame is `base_footprint` (URDF root link).
#   * Odometry is ground-truth from the Ignition DiffDrive plugin (no AMCL).
#   * `map -> odom` TF is published as identity by nav2.launch.py because the
#     robot spawns at world (0, 0) and odom origin coincides with map origin.
#   * Local controller is RPP (regulated_pure_pursuit) — geometric, suits the
#     zero-friction planar abstraction better than DWB's dynamics-aware roll-outs.
#   * Global planner is NavFn — the world is mostly empty, A* / Smac is overkill.

amcl:
  ros__parameters:
    use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "glass_basic.yaml"
    topic_name: "map"
    frame_id: "map"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    # 3.12 iteration 7: lowered from 10 Hz to 5 Hz to match the actual
    # lidar publish rate on the M4 (measured 5.9-6.4 Hz vs. nominal 10 Hz).
    # At 10 Hz the controller was acting on stale local_costmap updates
    # between lidar frames, producing visible drift after each U-turn.
    # 5 Hz means every controller tick has fresh sensor data.
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.50
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 3.12 iteration 7: lowered from 0.20 to 0.15 m/s along with
      # controller_frequency 10 -> 5 Hz so the robot does not outrun the
      # lidar/costmap update cadence on the M4.
      desired_linear_vel: 0.15
      # 3.12 iteration 4: lookahead tightened from 0.40 to 0.20 so the
      # controller does not "corner-cut" the U-turns between zigzag strips
      # (strip spacing = 0.30 m, so a 0.40 m lookahead reached across strips
      # and let the robot drift off-path). With 0.20 m the lookahead point
      # stays on the current strip during the turn.
      lookahead_dist: 0.20
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.40
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      # 3.12 iteration 5: tightened from 0.785 rad (45°) to 0.30 rad (~17°).
      # The boustrophedon plan emits waypoint yaws of 0 and pi between
      # strips, so each U-turn is a full 180° flip. Smooth-turning above
      # 45° produced ambiguous CCW/CW rotations (the robot would pick
      # either, then chase a lookahead carrot back on the previous strip).
      # Forcing in-place rotation at 17° guarantees the robot pivots
      # cleanly before driving the next strip.
      rotate_to_heading_min_angle: 0.30
      max_angular_accel: 2.5
      rotate_to_heading_angular_vel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot/scan
          max_obstacle_height: 0.30
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: false
      # ObstacleLayer intentionally omitted from the global costmap.
      # Reason (Phase 3, 3.12 iteration 3): with the lidar streaming at 10 Hz,
      # the moving robot kept "re-discovering" the static frame walls at
      # slightly different cells; each re-mark expanded the inflated ring
      # and NavFn would reject waypoints it had previously accepted. The
      # frame walls are already encoded in static_layer (window_cleaner_bringup/
      # maps/glass_basic.yaml), so the obstacle_layer added noise, not signal.
      # The local costmap keeps obstacle_layer for runtime collision avoidance.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      always_send_full_costmap: true
